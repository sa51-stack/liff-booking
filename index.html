<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夏休みイベント予約フォーム</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background-color: #f9f9f9; }
    h2 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    button { width: 100%; padding: 12px; background-color: #06C755; color: white; border: none; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #loading { text-align: center; color: #666; font-size: 16px; margin: 20px 0; }
    .note { font-size: 13px; color: #666; margin-top: -8px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <h2>夏休みイベント予約</h2>
  <p class="note">※ご兄弟で参加される場合は、お一人ずつこのフォームからお申し込みください。</p>

  <div id="loading">空席情報を読み込み中...</div>

  <form id="bookingForm" style="display: none;">
    <div class="form-group">
      <label for="schedule">希望日時・コース <span style="color:red;">*</span></label>
      <select id="schedule" name="schedule" required>
        <option value="">選択してください</option>
      </select>
    </div>

    <div class="form-group">
      <label for="parentName">保護者お名前 <span style="color:red;">*</span></label>
      <input type="text" id="parentName" name="parentName" placeholder="山田 太郎" required>
    </div>

    <div class="form-group">
      <label for="childName">お子様お名前 <span style="color:red;">*</span></label>
      <input type="text" id="childName" name="childName" placeholder="山田 花子" required>
    </div>

    <div class="form-group">
      <label for="grade">学年 <span style="color:red;">*</span></label>
      <select id="grade" name="grade" required>
        <option value="">選択してください</option>
        <option value="小学1年生">小学1年生</option>
        <option value="小学2年生">小学2年生</option>
        <option value="小学3年生">小学3年生</option>
        <option value="小学4年生">小学4年生</option>
        <option value="小学5年生">小学5年生</option>
        <option value="小学6年生">小学6年生</option>
        <option value="中学生以上">中学生以上</option>
      </select>
    </div>

    <div class="form-group">
      <label for="phone">電話番号 <span style="color:red;">*</span></label>
      <input type="tel" id="phone" name="phone" placeholder="09012345678" required>
    </div>

    <button type="submit" id="submitBtn">予約を確定する</button>
  </form>

  <script>
    // ★設定項目
    const LIFF_ID = '2010871919-M9Cm81wZ'; // ご自身のLIFF IDに書き換え
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzCNLPMxNsjwSrmW_x-xcZxKuSSMV5w-hfZdVxlTzzsHUitKVy8UwTgoDrF8Vsz4QZ9/exec'; // ご自身のGASウェブアプリURLに書き換え

    let userId = '';

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. LIFF初期化とループ防止対策
      if (typeof liff !== 'undefined' && LIFF_ID) {
        try {
          await liff.init({ liffId: LIFF_ID });
          
          // LINEアプリ内から開かれている場合の処理
          if (liff.isInClient()) {
            if (!liff.isLoggedIn()) {
              liff.login();
              return;
            }
          }
          
          // ログイン済み（または外部ブラウザ等）であればプロフィール取得を試みる
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            userId = profile.userId;
          }
        } catch (err) {
          console.warn('LIFF初期化エラー:', err);
        }
      }

      // 2. GASのAPIから空席データを取得
      fetch(GAS_URL + '?action=getSchedules')
        .then(response => response.json())
        .then(schedules => {
          renderSchedules(schedules);
        })
        .catch(error => {
          console.error('データ取得エラー:', error);
          document.getElementById('loading').textContent = 'データの読み込みに失敗しました。';
        });
    });

    // セレクトボックスに空席情報をセット
    function renderSchedules(schedules) {
      const loadingEl = document.getElementById('loading');
      const formEl = document.getElementById('bookingForm');
      const selectEl = document.getElementById('schedule');

      if (schedules && schedules.length > 0) {
        schedules.forEach(item => {
          const option = document.createElement('option');
          option.value = item.key;

          if (item.status === '満席') {
            option.textContent = `【満席】${item.schedule}`;
            option.disabled = true;
          } else {
            option.textContent = `【${item.status}】${item.schedule}`;
          }
          selectEl.appendChild(option);
        });

        loadingEl.style.display = 'none';
        formEl.style.display = 'block';
      } else {
        loadingEl.textContent = '現在予約可能な日程がございません。';
      }
    }

    // フォーム送信処理（GAS APIへPOST送信）
    document.getElementById('bookingForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      const formData = {
        userId: userId,
        key: document.getElementById('schedule').value,
        parentName: document.getElementById('parentName').value,
        childName: document.getElementById('childName').value,
        grade: document.getElementById('grade').value,
        phone: document.getElementById('phone').value
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(formData)
      })
      .then(response => response.json())
      .then(result => {
        if (result && result.status === 'success') {
          alert(result.message);
          // ウィンドウを閉じる（ループを防ぐため確実に分岐）
          if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
            liff.closeWindow();
          } else {
            location.reload();
          }
        } else {
          alert('エラー: ' + (result ? result.message : '送信に失敗しました'));
          submitBtn.disabled = false;
          submitBtn.textContent = '予約を確定する';
        }
      })
      .catch(err => {
        alert('送信エラーが発生しました。');
        submitBtn.disabled = false;
        submitBtn.textContent = '予約を確定する';
      });
    });
  </script>
</body>
</html>
